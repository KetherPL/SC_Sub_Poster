[package]
name = "SC_Sub_Poster"
version = "0.10.0"
edition = "2024"
authors = ["Dominik Adrian Grzywak <starterx4@gmail.com>"]
description = "Steam Chat client library: group chats and private messages, built on steam-vent"
repository = "https://github.com/KetherPL/SC_Sub_Poster"
homepage = "https://kether.pl"
license = "LGPL-3.0-only"
rust-version = "1.91"

[dependencies]
tokio = { version = "1.x", features = ["full", "macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing-subscriber = "0.3"
steamid-ng = "1.0.0"
steamid-ng3 = { version = "3.0", package = "steamid-ng" } #logon.rs version missmatch as steam-vent uses v3 but we stick to v1
serde = { version = "1.0", features = ["derive"] }
steam-vent = "0.5.0"
steam-vent-proto = "0.5.2"
thiserror = "1.0.69"
futures-util = "0.3"
tracing = "0.1"

[features]
# Private (friend) messaging beyond plain send/receive: typing, read receipts, history,
# active conversations, reactions and richer listeners.
default = ["friend-messages"]
friend-messages = []
# Extra group chat notifications: deleted messages, member/room/header changes, disconnects.
chat-events = []
# Group moderation: kick, ban/unban, ban list, mute, invite list, revoke invites.
chat-moderation = []
# Group roles: create/rename/reorder/delete roles, role permissions, assign/unassign.
chat-roles = []
# Group invites: invite friends, invite links, resolving invite codes.
chat-invites = []
# Group administration: create/rename groups, tagline, avatar, rooms, Steam-group chat privacy.
chat-admin = []
# Voice chat signalling (join/leave); no audio transport.
chat-voice = []
# Everything above.
full = [
    "friend-messages",
    "chat-events",
    "chat-moderation",
    "chat-roles",
    "chat-invites",
    "chat-admin",
    "chat-voice",
]

[dev-dependencies]
tokio = { version = "1.x", features = ["full", "macros", "rt", "rt-multi-thread"] }
tracing-subscriber = "0.3"
serde_json = "1.0"

[[example]]
name = "env_credentials"

[[example]]
name = "chat_demo"

[[example]]
name = "main_demo"

# The default release profile. It contains all optimizations, without
# sacrificing debug info. With this profile (like in the standard
# release profile), the debug info and the stack traces will still be available.
[profile.release]
lto = true
strip = true
